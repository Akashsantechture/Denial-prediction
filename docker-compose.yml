version: "3.9"

# =============================================================================
# ClaimAI — Docker Compose
# =============================================================================
# Services:
#   prediction-api  →  model2main.py     port 8000
#   analyst         →  ai_analyst/main.py  port 8060
#
# PostgreSQL is expected to be running on the HOST machine (not in Docker).
# host.docker.internal resolves to the host on Docker Desktop for Windows.
#
# Usage:
#   docker compose up --build          # first time / after code changes
#   docker compose up                  # subsequent runs (uses cached images)
#   docker compose down                # stop and remove containers
#   docker compose logs -f             # follow logs for both services
#   docker compose logs -f analyst     # follow logs for analyst only
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Denial Prediction API
  # ---------------------------------------------------------------------------
  prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: denial-prediction-api
    container_name: prediction-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI Analyst Microservice
  # ---------------------------------------------------------------------------
  analyst:
    build:
      context: .
      dockerfile: ai_analyst/Dockerfile
    image: denial-analyst
    container_name: analyst
    ports:
      - "8060:8060"
    environment:
      # Override the Windows absolute path from ai_analyst/.env
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
      # Replace localhost with host.docker.internal so the container
      # can reach PostgreSQL running on the host machine
      DATABASE_URL: postgresql+psycopg2://postgres:2004@host.docker.internal:5432/Denial-prediction
      GOOGLE_CLOUD_PROJECT: doc-triaging-463411
      GOOGLE_CLOUD_LOCATION: us-central1
      GEMINI_MODEL: gemini-2.5-flash
    # extra_hosts is required on Linux Docker (not needed on Docker Desktop Windows
    # but harmless to include)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
